kind = "mobile"
previewPath = "/doto-mobile/"
title = "Doto Trading App"
description = "A mobile trading companion inspired by the provided Doto screenshots, with account onboarding, trading ideas, wallet actions, and mock market data."
version = "1.0.0"
id = "artifacts/doto-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/doto-mobile/" ]
localPort = 22839

[services.development]
run = "pnpm --filter @workspace/doto-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doto-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/doto-mobile", "run", "serve" ]

[services.env]
PORT = "22839"
BASE_PATH = "/doto-mobile/"
